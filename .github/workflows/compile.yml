name: Build STM32 Binary
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install ARM Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi

      - name: Build Firmware
        run: |
          # Возвращаем main.c в корень, если он застрял в папке src
          mv src/main.c ./main.c || true
          
          # Компиляция локальных файлов без скачивания из интернета
          arm-none-eabi-gcc -c -mcpu=cortex-m7 -mthumb -O2 -I. -DSTM32F722xx main.c -o main.o
          
          # Линковка со смещением памяти под Betaflight Loader
          arm-none-eabi-gcc main.o -mcpu=cortex-m7 -mthumb -specs=nano.specs -Ttext=0x0800C000 -o firmware.elf
          
          # Вывод готового .bin файла
          arm-none-eabi-objcopy -O binary firmware.elf firmware.bin

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mamba_vgr_firmware
          path: firmware.bin
