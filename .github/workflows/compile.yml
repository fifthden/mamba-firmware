name: Build STM32 Binary
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install ARM Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi

      - name: Clone STM32CubeF7 Drivers
        run: |
          # Скачиваем официальные файлы HAL библиотек STM32F7
          git clone --depth 1 https://github.com stm32_hal

      - name: Build Code
        run: |
          # Компилируем ваш main.c с указанием путей к скачанным HAL драйверам
          arm-none-eabi-gcc -c -mcpu=cortex-m7 -mthumb -O2 \
            -I./stm32_hal/Drivers/STM32F7xx_HAL_Driver/Inc \
            -I./stm32_hal/Drivers/CMSIS/Device/ST/STM32F7xx/Include \
            -I./stm32_hal/Drivers/CMSIS/Include \
            -DSTM32F722xx \
            main.c -o main.o
          
          # Линкуем со смещением вектора под загрузчик Betaflight (0x0800C000)
          arm-none-eabi-gcc main.o -mcpu=cortex-m7 -mthumb -specs=nano.specs -Ttext=0x0800C000 -o firmware.elf
          
          # Конвертируем в итоговый бинарник .bin
          arm-none-eabi-objcopy -O binary firmware.elf firmware.bin

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mamba_vgr_firmware
          path: firmware.bin
