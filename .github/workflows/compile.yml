name: Build STM32 Binary
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install ARM Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi cmake

      - name: Build Code
        run: |
          # Компилируем исходный код
          arm-none-eabi-gcc -c -mcpu=cortex-m7 -mthumb -O2 main.c -o main.o
          
          # Линкуем со смещением вектора под Betaflight (0x0800C000)
          arm-none-eabi-gcc main.o -mcpu=cortex-m7 -mthumb -specs=nano.specs -Ttext=0x0800C000 -Wl,-Map=output.map -o firmware.elf
          
          # Конвертируем в итоговый бинарник .bin
          arm-none-eabi-objcopy -O binary firmware.elf firmware.bin

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mamba_vgr_firmware
          path: firmware.bin
