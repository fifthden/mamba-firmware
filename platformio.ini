name: Build STM32 Binary
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build Firmware
        run: |
          # Запуск автоматической сборки проекта под STM32F722
          pio run

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mamba_vgr_firmware
          path: .pio/build/genericSTM32F722RET6/firmware.bin
